events {
    worker_connections 1024;
}

http {
    # Define the group of servers to load balance
    upstream backend_servers {
        # 'backend-service' is the name of the service in docker-compose
        # Docker's internal DNS will resolve this to the IP of the containers
        server backend-service:3000;
    }

    server {
        listen 80;

        # Forward requests starting with /api to the backend upstream
        location /api {
            proxy_pass http://backend_servers;
            
            # Standard headers for proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check or default response
        location / {
            return 200 'NGINX is running. Send requests to /api to reach the backend load balancer.\n';
            add_header Content-Type text/plain;
        }
    }
}
