version: '3.8'

services:
  # Backend Service with 2 replicas for load balancing
  backend-service:
    build: ./backend
    deploy:
      replicas: 2
    networks:
      - app-network

  # NGINX Proxy
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
