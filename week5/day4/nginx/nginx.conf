events {
    worker_connections 1024;
}

http {
    # Define the group of servers to load balance
    upstream backend_servers {
        # 'backend-service' is the name of the service in docker-compose
        # Docker's internal DNS will resolve this to the IP of the containers
        server backend-service:3000;
    }

    # Redirect all HTTP requests to HTTPS
    server {
        listen 80;
        server_name local.myapp.com;

        # Send to secure version
        return 301 https://$host$request_uri;
    }

    # Handle HTTPS requests
    server {
        listen 443 ssl;
        server_name local.myapp.com;

        # Use the certificates generated by mkcert
        ssl_certificate /etc/nginx/certs/local.myapp.com.crt;
        ssl_certificate_key /etc/nginx/certs/local.myapp.com.key;

        # Standard SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Forward requests starting with /api to the backend upstream
        location /api {
            proxy_pass http://backend_servers;
            
            # Standard headers for proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check or default response
        location / {
            return 200 'NGINX is running securely on HTTPS! Send requests to /api to reach the backend load balancer.\n';
            add_header Content-Type text/plain;
        }
    }
}
